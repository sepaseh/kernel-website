sonar.organization=sepaseh
sonar.sources=src,scripts,.github,.agents,eslint.config.mjs,vitest.config.ts,deploy/docker
sonar.tests=src,scripts,e2e,deploy/docker,playwright.smoke.config.ts,playwright.staging.config.ts,playwright.visual.config.ts,playwright.website.config.ts
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**/*.ts,src/test/**/*.tsx,scripts/*.test.mjs,e2e/**/*.ts,playwright.*.config.ts
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**/*.ts,src/test/**/*.tsx,scripts/*.test.mjs
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/governance/lcov.info
sonar.python.coverage.reportPaths=coverage/governance/font-coverage.xml
sonar.qualitygate.wait=false
