sonar.organization=sepaseh
sonar.sources=src,scripts,.agents/hooks,deploy/docker
sonar.tests=src,scripts,e2e,deploy/docker,playwright.smoke.config.ts,playwright.staging.config.ts,playwright.visual.config.ts,playwright.website.config.ts
sonar.test.inclusions=deploy/docker/*.test.mjs,src/**/*.test.ts,src/**/*.test.tsx,src/test/**/*.ts,src/test/**/*.tsx,scripts/*.test.mjs,e2e/**/*.ts,playwright.*.config.ts,scripts/api-fixture-test-support.mjs
sonar.exclusions=deploy/docker/*.test.mjs,src/**/*.test.ts,src/**/*.test.tsx,src/test/**/*.ts,src/test/**/*.tsx,scripts/*.test.mjs,scripts/api-fixture-test-support.mjs
# Static catalog schemas repeat keys; literal-only catalog tests reject hidden logic.
# This affects duplication only; source, security and measured coverage remain included.
sonar.cpd.exclusions=src/i18n/catalog-data/locales/*.ts
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/governance/lcov.info
sonar.python.coverage.reportPaths=coverage/fonts/coverage.xml
sonar.qualitygate.wait=false
