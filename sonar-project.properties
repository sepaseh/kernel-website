sonar.organization=sepaseh
sonar.sources=src,scripts
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**/*.ts,scripts/*.test.mjs
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**/*.ts,scripts/*.test.mjs
# Static catalog schemas repeat keys; literal-only catalog tests reject hidden logic.
# This affects duplication only; source, security and measured coverage remain included.
sonar.cpd.exclusions=src/i18n/catalog-data/locales/*.ts
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/governance/lcov.info
sonar.python.coverage.reportPaths=coverage/fonts/coverage.xml
sonar.qualitygate.wait=false
