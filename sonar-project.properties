sonar.organization=sepaseh
sonar.sources=src,scripts,.github,.agents,eslint.config.mjs,vitest.config.ts
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,src/test/**/*.ts,scripts/*.test.mjs
sonar.exclusions=src/**/*.test.ts,src/test/**/*.ts,scripts/*.test.mjs
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/governance/lcov.info
sonar.python.coverage.reportPaths=coverage/governance/font-coverage.xml
sonar.qualitygate.wait=false
