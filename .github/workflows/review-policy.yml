name: CodeRabbit approval policy

on:
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        converted_to_draft,
        closed,
      ]
  workflow_run:
    workflows: [CodeRabbit review signal]
    types: [completed]
  check_run:
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: coderabbit-approval-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.workflow_ref == format('{0}/.github/workflows/review-policy.yml@refs/heads/{1}', github.repository, github.event.repository.default_branch) && (github.event_name != 'check_run' || (github.event.check_run.app.id == 347564 && github.event.check_run.name == 'CodeRabbit'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify live review evidence and publish the separate head status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/review-policy.mjs
