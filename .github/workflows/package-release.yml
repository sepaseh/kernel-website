name: Package immutable website release
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release identifier
        required: true
        type: string
concurrency:
  group: website-package-${{ inputs.release_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      HOSTNAME: 127.0.0.1
      PORT: "3010"
      WEBSITE_URL: http://127.0.0.1:3010
      API_BASE_URL: http://127.0.0.1:3100
      WEBSITE_INDEXING_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      KERNEL_SYNTHETIC_ENV: "1"
      NPM_CONFIG_INCLUDE: dev
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run deploy:package -- --release="$RELEASE_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: website-release-${{ github.run_id }}
          path: dist/releases
          retention-days: 14
          if-no-files-found: error
