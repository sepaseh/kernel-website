name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HOSTNAME: 127.0.0.1
  PORT: "3010"
  WEBSITE_URL: http://127.0.0.1:3010
  API_BASE_URL: http://127.0.0.1:3100
  WEBSITE_INDEXING_ENABLED: "false"
  NODE_ENV: production
  KERNEL_SYNTHETIC_ENV: "1"
  PLAYWRIGHT_BROWSERS_PATH: "0"
  NPM_CONFIG_INCLUDE: dev

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the immutable independent synthetic API
        env:
          KERNEL_API_DIRECTORY: ${{ runner.temp }}/kernel-api-fixture
        run: |
          git clone --no-checkout https://github.com/sepaseh/kernel-api.git "$env:KERNEL_API_DIRECTORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:KERNEL_API_DIRECTORY" checkout --detach 4755d62d14fb9d53cbe9d6246ca9be6bb4a3a7a9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix "$env:KERNEL_API_DIRECTORY" ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "KERNEL_API_DIRECTORY=$env:KERNEL_API_DIRECTORY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.4"
      - run: python -m pip install --requirement font-source/requirements.txt
      - name: Install the root-owned bundled Chromium
        run: node node_modules/@playwright/test/cli.js install chromium
      - run: npm run validate -- full
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the immutable independent synthetic API
        env:
          KERNEL_API_DIRECTORY: ${{ runner.temp }}/kernel-api-fixture
        run: |
          git clone --no-checkout https://github.com/sepaseh/kernel-api.git "$env:KERNEL_API_DIRECTORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:KERNEL_API_DIRECTORY" checkout --detach 4755d62d14fb9d53cbe9d6246ca9be6bb4a3a7a9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix "$env:KERNEL_API_DIRECTORY" ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "KERNEL_API_DIRECTORY=$env:KERNEL_API_DIRECTORY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run build

  e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the immutable independent synthetic API
        env:
          KERNEL_API_DIRECTORY: ${{ runner.temp }}/kernel-api-fixture
        run: |
          git clone --no-checkout https://github.com/sepaseh/kernel-api.git "$env:KERNEL_API_DIRECTORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:KERNEL_API_DIRECTORY" checkout --detach 4755d62d14fb9d53cbe9d6246ca9be6bb4a3a7a9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix "$env:KERNEL_API_DIRECTORY" ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "KERNEL_API_DIRECTORY=$env:KERNEL_API_DIRECTORY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the root-owned bundled Chromium
        run: node node_modules/@playwright/test/cli.js install chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  visual:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the immutable independent synthetic API
        env:
          KERNEL_API_DIRECTORY: ${{ runner.temp }}/kernel-api-fixture
        run: |
          git clone --no-checkout https://github.com/sepaseh/kernel-api.git "$env:KERNEL_API_DIRECTORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:KERNEL_API_DIRECTORY" checkout --detach 4755d62d14fb9d53cbe9d6246ca9be6bb4a3a7a9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix "$env:KERNEL_API_DIRECTORY" ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "KERNEL_API_DIRECTORY=$env:KERNEL_API_DIRECTORY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the root-owned bundled Chromium
        run: node node_modules/@playwright/test/cli.js install chromium
      - run: npm run build
      - run: npm run test:visual
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 14
