name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HOSTNAME: 127.0.0.1
  PORT: "3010"
  WEBSITE_URL: http://127.0.0.1:3010
  API_BASE_URL: http://127.0.0.1:3100
  WEBSITE_INDEXING_ENABLED: "false"
  NODE_ENV: production
  KERNEL_SYNTHETIC_ENV: "1"
  PLAYWRIGHT_BROWSERS_PATH: "0"
  NPM_CONFIG_INCLUDE: dev

jobs:
  quality:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install validation dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Run static checks
        run: npm run validate -- ci-quality

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Run dependency audit
        run: npm run validate -- ci-audit

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact }}
      attempt: ${{ steps.evidence.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install validation dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Run unit tests
        run: npm run validate -- ci-unit
      - name: Bind measured coverage to this suite, run and source
        id: evidence
        env:
          CI_EVIDENCE_SUITE: unit
        run: node scripts/ci-evidence.mjs --record
      - name: Share measured suite coverage with analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: |
            coverage/unit/lcov.info
            coverage/unit/ci-evidence.json
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false

  governance:
    name: Governance tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact }}
      attempt: ${{ steps.evidence.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install validation dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.4"
      - name: Install font validation dependencies
        run: "python -m pip install --require-hashes --only-binary :all: --requirement font-source/requirements.txt"
      - name: Run governance tests and font integrity
        run: npm run validate -- ci-governance
      - name: Bind measured coverage to this suite, run and source
        id: evidence
        env:
          CI_EVIDENCE_SUITE: governance
        run: node scripts/ci-evidence.mjs --record
      - name: Share measured suite coverage with analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: |
            coverage/governance/lcov.info
            coverage/governance/ci-evidence.json
            coverage/governance/font-coverage.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false

  build:
    name: Application build and bundle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install application dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Check unused source and production bundle budgets
        run: npm run validate -- ci-build
      - name: Bind the verified build to this run and source
        id: evidence
        run: node scripts/ci-evidence.mjs --record-build
      - name: Share the verified standalone build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: |
            .next/
            !.next/cache/**
            !.next/standalone/.next/cache/**
            !.next/standalone/.next/server/route-cache/**
            coverage/verification-build.json
            coverage/ci-build-evidence.json
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: true
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact }}
      attempt: ${{ steps.evidence.outputs.attempt }}
  e2e:
    name: Application E2E tests
    needs:
      - build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install application dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install the root-owned bundled Chromium
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Download the exact build producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .
          digest-mismatch: error
      - name: Verify build provenance, source and output bytes
        env:
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-build
      - name: Run application E2E tests
        run: npm run validate -- ci-e2e
      - name: Retain e2e acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
  accessibility:
    name: Accessibility tests
    needs:
      - build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install application dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install the root-owned bundled Chromium
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Download the exact build producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .
          digest-mismatch: error
      - name: Verify build provenance, source and output bytes
        env:
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-build
      - name: Run accessibility tests
        run: npm run validate -- ci-accessibility
      - name: Retain accessibility acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accessibility-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
  seo:
    name: SEO tests
    needs:
      - build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install application dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install the root-owned bundled Chromium
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Download the exact build producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .
          digest-mismatch: error
      - name: Verify build provenance, source and output bytes
        env:
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-build
      - name: Run SEO tests
        run: npm run validate -- ci-seo
      - name: Retain seo acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: seo-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
  csp:
    name: CSP tests
    needs:
      - build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install application dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install the root-owned bundled Chromium
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Download the exact build producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .
          digest-mismatch: error
      - name: Verify build provenance, source and output bytes
        env:
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-build
      - name: Run CSP tests
        run: npm run validate -- ci-csp
      - name: Retain csp acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: csp-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
  visual:
    name: Visual comparison
    needs:
      - build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install application dependencies
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install the root-owned bundled Chromium
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Download the exact build producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .
          digest-mismatch: error
      - name: Verify build provenance, source and output bytes
        env:
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-build
      - name: Run visual comparison
        run: npm run validate -- ci-visual
      - name: Retain visual acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: visual-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false

  check:
    needs:
      [
        quality,
        audit,
        unit,
        governance,
        build,
        e2e,
        accessibility,
        seo,
        csp,
        visual,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every verification job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node -e "const needs = JSON.parse(process.env.CI_NEEDS); const required = ['quality', 'audit', 'unit', 'governance', 'build', 'e2e', 'accessibility', 'seo', 'csp', 'visual']; if (required.some(id => needs[id]?.result !== 'success')) process.exit(1);"

  analysis:
    name: SonarQube Cloud analysis
    needs: [check, unit, governance]
    if: needs.check.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require configured SonarQube Cloud analysis
        env:
          SONAR_TOKEN_CONFIGURED: ${{ secrets.SONAR_TOKEN != '' }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [[ "$SONAR_TOKEN_CONFIGURED" != 'true' || -z "$SONAR_PROJECT_KEY" ]]; then
            echo '::error::Configure SONAR_TOKEN and SONAR_PROJECT_KEY before analysis. No Sonar analysis was performed.'
            exit 1
          fi
      - name: Download measured unit coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.unit.outputs.artifact }}
          path: coverage/unit
          digest-mismatch: error
      - name: Verify unit coverage provenance and contents
        env:
          CI_EVIDENCE_SUITE: unit
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.unit.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-coverage
      - name: Download measured governance coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.governance.outputs.artifact }}
          path: coverage/governance
          digest-mismatch: error
      - name: Verify governance coverage provenance and contents
        env:
          CI_EVIDENCE_SUITE: governance
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.governance.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-coverage
      - name: Install analysis dependencies without running package scripts
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Analyze governance tooling and measured coverage
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
